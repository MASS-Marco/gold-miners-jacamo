<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 575" role="img" aria-labelledby="titulo desc"><title id="titulo">Processo de tentativa de coleta e recuperação</title><desc id="desc">A coordenação define o responsável. O minerador tenta coletar e entregar. O ambiente confere. Uma entrega confirmada encerra a missão; caso contrário a coordenação reavalia se deve retomar ou encerrar como inconclusiva.</desc><defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#31535f"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#203e4a;font-size:19px} .label{font-size:16px} .edge{fill:none;stroke:#31535f;stroke-width:2;marker-end:url(#seta)}</style><rect width="1180" height="575" fill="white"/><rect x="50" y="20" width="1110" height="160" fill="#f3f8f8" stroke="#aac4cb"/><text transform="translate(42,100.0) rotate(-90)" text-anchor="middle">Coordenação</text><rect x="50" y="180" width="1110" height="170" fill="#f3f8f8" stroke="#aac4cb"/><text transform="translate(42,265.0) rotate(-90)" text-anchor="middle">Minerador</text><rect x="50" y="350" width="1110" height="190" fill="#f3f8f8" stroke="#aac4cb"/><text transform="translate(42,445.0) rotate(-90)" text-anchor="middle">Ambiente</text><polyline class="edge" points="111,98 150,100"/><polyline class="edge" points="320,100 345,100 345,265 370,265"/><polyline class="edge" points="540,265 560,265 560,440 590,440"/><polyline class="edge" points="750,440 800,445"/><polyline class="edge" points="850,445 1010,450"/><polyline class="edge" points="825,420 825,300 900,300 900,130"/><polyline class="edge" points="990,100 1010,100"/><polyline class="edge" points="1035,75 1035,40 235,40 235,70"/><polyline class="edge" points="1060,100 1100,100"/><circle cx="93.0" cy="98.0" r="16.0" fill="white" stroke="#1e6b72" stroke-width="2"/><text class="label" x="93.0" y="138" text-anchor="middle">Missão</text><text class="label" x="93.0" y="157" text-anchor="middle">aberta</text><rect x="150" y="70" width="170" height="60" rx="9" fill="white" stroke="#1e6b72" stroke-width="2"/><text x="235.0" y="96.0" text-anchor="middle">Definir</text><text x="235.0" y="119.0" text-anchor="middle">responsável</text><rect x="370" y="235" width="170" height="60" rx="9" fill="white" stroke="#1e6b72" stroke-width="2"/><text x="455.0" y="261.0" text-anchor="middle">Tentar coleta</text><text x="455.0" y="284.0" text-anchor="middle">e entrega</text><rect x="590" y="410" width="160" height="60" rx="9" fill="white" stroke="#1e6b72" stroke-width="2"/><text x="670.0" y="436.0" text-anchor="middle">Conferir</text><text x="670.0" y="459.0" text-anchor="middle">resultado</text><path d="M825.0 420L850 445.0L825.0 470L800 445.0Z" fill="#fff5d9" stroke="#946717" stroke-width="2"/><text x="825.0" y="452.0" text-anchor="middle">×</text><text class="label" x="825.0" y="493" text-anchor="middle">Entrega confirmada?</text><circle cx="1028.0" cy="450.0" r="16.0" fill="white" stroke="#1e6b72" stroke-width="4"/><text class="label" x="1028.0" y="490" text-anchor="middle">Entrega</text><text class="label" x="1028.0" y="509" text-anchor="middle">confirmada</text><rect x="800" y="70" width="190" height="60" rx="9" fill="white" stroke="#1e6b72" stroke-width="2"/><text x="895.0" y="96.0" text-anchor="middle">Reavaliar missão</text><text x="895.0" y="119.0" text-anchor="middle">e carga</text><path d="M1035.0 75L1060 100.0L1035.0 125L1010 100.0Z" fill="#fff5d9" stroke="#946717" stroke-width="2"/><text x="1035.0" y="107.0" text-anchor="middle">×</text><text class="label" x="1035.0" y="148" text-anchor="middle">Retomar?</text><circle cx="1118.0" cy="100.0" r="16.0" fill="white" stroke="#1e6b72" stroke-width="4"/><text class="label" x="1118.0" y="140" text-anchor="middle">Missão</text><text class="label" x="1118.0" y="159" text-anchor="middle">inconclusiva</text><text class="label" x="920" y="432">Sim</text><text class="label" x="835" y="315">Não</text><text class="label" x="620" y="35">Sim</text><text class="label" x="1080" y="86">Não</text><text class="label" x="590" y="566" text-anchor="middle">Modelo de análise BPMN 2.0 · proposto para estudo · sem execução automática</text></svg>